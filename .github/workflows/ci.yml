name: Docs CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout docs
        uses: actions/checkout@v4

      - name: Checkout current Statics source
        uses: actions/checkout@v4
        with:
          repository: EqualFiLabs/statics
          ref: master
          path: .verification/statics

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check current-source drift
        env:
          STATICS_PATH: ${{ github.workspace }}/.verification/statics
        run: npm run check:source

      - name: Check links, types, and production build
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run verify
